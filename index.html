<script>
(function () {
  var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
  var STORAGE_KEY = 'bh_utm_params';

  // 1) На любой странице: если в адресе есть utm-метки — сохраняем их в sessionStorage.
  // Ничего не делаем, если меток в адресе нет (чтобы не затереть уже сохранённые)
  try {
    var params = new URLSearchParams(window.location.search);
    var found = {};
    var hasAny = false;
    UTM_KEYS.forEach(function (k) {
      var v = params.get(k);
      if (v) { found[k] = v; hasAny = true; }
    });
    if (hasAny) sessionStorage.setItem(STORAGE_KEY, JSON.stringify(found));
  } catch (e) {}

  // Дальше — только логика для страницы "Спасибо"
  if (window.location.pathname.indexOf('/thank-you') === -1) return;
  if (window.__bhLinksUpdated) return;

  // 2) Достаём сохранённые utm-метки
  var utm = {};
  try { utm = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
  var utmSuffix = Object.keys(utm)
    .map(function (k) { return k + '=' + encodeURIComponent(utm[k]); })
    .join('&');

  // 3) БАЗОВЫЕ UTM-ССЫЛКИ ИЗ БОТHELP (уже ваши реальные, ничего менять не нужно)
  var BOT_LINKS = {
    telegram: 'https://r.bothelp.io/tg?domain=FaloleevaPsybot&start=c1788885417198-ds',
    max: 'https://r.bothelp.io/max?domain=id505003981273_bot&start=c1788973683396-ds'
  };

  function buildUrl(base) {
    if (!base) return null;
    if (!utmSuffix) return base;
    return base + (base.indexOf('?') > -1 ? '&' : '?') + utmSuffix;
  }

  // Узнаём кнопку и по старой ссылке-диплинку (t.me/..., max.ru/...),
  // и по уже проставленной вручную UTM-ссылке (r.bothelp.io/tg..., r.bothelp.io/max...)
  // — так скрипт работает, что бы ни стояло в href на момент вставки кода.
  function detectTarget(href) {
    if (href.indexOf('t.me/FaloleevaPsybot') > -1 || href.indexOf('/tg?domain=FaloleevaPsybot') > -1) {
      return 'telegram';
    }
    if (href.indexOf('max.ru/id505003981273_bot') > -1 || href.indexOf('/max?domain=id505003981273_bot') > -1) {
      return 'max';
    }
    return null;
  }

  function updateLinks() {
    var links = document.querySelectorAll('a[href]');
    var updated = false;
    links.forEach(function (a) {
      var target = detectTarget(a.href);
      if (!target) return;
      var url = buildUrl(BOT_LINKS[target]);
      if (url && a.href !== url) { a.href = url; updated = true; }
    });
    return updated;
  }

  // Кнопки на React-странице рендерятся асинхронно — ждём их появления
  if (updateLinks()) {
    window.__bhLinksUpdated = true;
  } else {
    var attempts = 0;
    var timer = setInterval(function () {
      attempts++;
      if (updateLinks() || attempts > 50) {
        clearInterval(timer);
        window.__bhLinksUpdated = true;
      }
    }, 200);
  }
})();
</script>

<script>
(function () {
  if (window.__emailCaptureInited) return;
  window.__emailCaptureInited = true;

  function captureEmail(e) {
    try {
      var form = e.target; // событие submit всегда таргетится на <form>
      if (!form || !form.querySelector) return;
      var emailInput = form.querySelector('input[type="email"]');
      if (!emailInput || !emailInput.value) return;
      var email = emailInput.value.trim();
      if (!email) return;
      localStorage.setItem('faloleeva_efir09_email', email);
      localStorage.setItem('faloleeva_efir09_email_ts', String(Date.now()));
    } catch (err) {
      // localStorage может быть недоступен (приватный режим и т.п.) — тихо игнорируем,
      // на /thank-you просто не покажется "умная" кнопка (см. часть 2)
    }
  }

  // capture: true — слушаем ДО того, как событие дойдёт до обработчика самого сайта
  document.addEventListener('submit', captureEmail, true);
})();
</script>

<script>
(function () {
  if (window.location.pathname.indexOf('/thank-you') === -1) return;
  if (window.__smartMailBtnInited) return;

  var PROVIDERS = [
    { domains: ['gmail.com', 'googlemail.com'], url: 'https://mail.google.com/mail/u/0/#inbox', name: 'Gmail' },
    { domains: ['yandex.ru', 'yandex.com', 'ya.ru', 'yandex.by', 'yandex.kz', 'yandex.ua'], url: 'https://mail.yandex.ru/', name: 'Яндекс Почту' },
    { domains: ['mail.ru', 'inbox.ru', 'list.ru', 'bk.ru'], url: 'https://e.mail.ru/inbox/', name: 'Почту Mail.ru' },
    { domains: ['rambler.ru'], url: 'https://mail.rambler.ru/', name: 'Рамблер Почту' },
    { domains: ['outlook.com', 'hotmail.com', 'live.com', 'msn.com'], url: 'https://outlook.live.com/mail/', name: 'Outlook' },
    { domains: ['icloud.com', 'me.com'], url: 'https://www.icloud.com/mail', name: 'iCloud Почту' },
    { domains: ['yahoo.com'], url: 'https://mail.yahoo.com/', name: 'Yahoo Почту' }
  ];

  function findProvider(email) {
    var domain = (email.split('@')[1] || '').toLowerCase().trim();
    if (!domain) return null;
    for (var i = 0; i < PROVIDERS.length; i++) {
      if (PROVIDERS[i].domains.indexOf(domain) !== -1) return PROVIDERS[i];
    }
    return null;
  }

  function init() {
    var btn = document.getElementById('open-mail-btn');
    if (!btn) return false;

    var email = null;
    try { email = localStorage.getItem('faloleeva_efir09_email'); } catch (err) {}

    var provider = email ? findProvider(email) : null;

    if (provider) {
      btn.textContent = 'Перейти в ' + provider.name;
      btn.addEventListener('click', function () {
        window.open(provider.url, '_blank', 'noopener');
      });
    } else {
      // Email не сохранился (другой браузер/устройство, приватный режим, localStorage заблокирован)
      // или почтовый сервис не из списка — честно прячем "умную" кнопку, а не гадаем
      btn.style.display = 'none';
    }
    window.__smartMailBtnInited = true;
    return true;
  }

  // Кнопка рендерится React'ом асинхронно — ждём её появления
  if (!init()) {
    var attempts = 0;
    var timer = setInterval(function () {
      attempts++;
      if (init() || attempts > 50) clearInterval(timer);
    }, 200);
  }
})();
</script>
